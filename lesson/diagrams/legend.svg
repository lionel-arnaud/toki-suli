<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 100" width="220" height="100" font-family="-apple-system,Helvetica,Arial,sans-serif"><defs>
    <marker id="arrUp" markerWidth="8" markerHeight="8" refX="4" refY="0" orient="auto">
      <path d="M0,6 L4,0 L8,6 Z" fill="#2a2521"/>
    </marker>
    <marker id="arrDown" markerWidth="8" markerHeight="8" refX="4" refY="6" orient="auto">
      <path d="M0,0 L8,0 L4,6 Z" fill="#2a2521"/>
    </marker>
  </defs>
  <line x1="4" y1="20" x2="210" y2="20" stroke="#b8ac9a" stroke-width="1" stroke-dasharray="2 3"/><text x="0" y="23" font-size="8" fill="#7a7268">H</text><line x1="4" y1="50" x2="210" y2="50" stroke="#b8ac9a" stroke-width="1" stroke-dasharray="2 3"/><text x="0" y="53" font-size="8" fill="#7a7268">M</text><line x1="4" y1="80" x2="210" y2="80" stroke="#b8ac9a" stroke-width="1" stroke-dasharray="2 3"/><text x="0" y="83" font-size="8" fill="#7a7268">L</text>
  <text x="14" y="14" font-size="9" fill="#7a7268">dashed lines = the 3 whistled vowel pitches</text>
  <line x1="14" y1="30" x2="70" y2="30" stroke="#2a2521" stroke-width="2.5"/>
  <text x="76" y="33" font-size="9" fill="#2a2521">solid = sound present (vowel, or Continuous consonant)</text>
  <line x1="14" y1="46" x2="45" y2="46" stroke="#2a2521" stroke-width="1.5"/>
  <line x1="45" y1="40" x2="45" y2="52" stroke="#2a2521" stroke-width="1.5"/>
  <line x1="65" y1="40" x2="65" y2="52" stroke="#2a2521" stroke-width="1.5"/>
  <text x="76" y="49" font-size="9" fill="#2a2521">gap = Interrupted (abrupt full silence)</text>
  <line x1="14" y1="60" x2="20" y2="61" stroke="#2a2521" stroke-width="2.2" stroke-linecap="round"/>
  <line x1="26" y1="62" x2="31" y2="63" stroke="#2a2521" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="37" y1="63" x2="41" y2="64" stroke="#2a2521" stroke-width="1" stroke-linecap="round"/>
  <text x="76" y="65" font-size="9" fill="#2a2521">fading dots = Gradual (smooth fade to silence)</text>
  <line x1="14" y1="78" x2="14" y2="78" marker-start="url(#arrUp)"/>
  <text x="30" y="81" font-size="9" fill="#2a2521">arrow up/down = pitch glide direction &amp; distance (locus)</text>
  <circle cx="16" cy="94" r="4" fill="none" stroke="#2a2521" stroke-width="2"/>
  <text x="30" y="97" font-size="9" fill="#2a2521">circle = Mid locus (no pitch motion, just a volume pulse)</text>
</svg>