<!doctype html>
<html lang="en">
<head>
<base href="../">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>toki suli — learning guide</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf8f4;
    --fg: #2a2521;
    --card: #ffffff;
    --border: #ddd4c8;
    --accent: #a35b2f;
    --muted: #7a7268;
    --code-bg: #f1ece3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1a17;
      --fg: #ece7df;
      --card: #262320;
      --border: #3c362f;
      --accent: #e0955c;
      --muted: #a89f92;
      --code-bg: #2f2a24;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 56px;
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.6;
  }
  main { max-width: 760px; margin: 0 auto; }
  .topnav { display: flex; gap: 14px; margin-bottom: 20px; font-size: 0.9rem; }
  a { color: var(--accent); }
  #content h1 { font-size: 1.6rem; border-bottom: 1px solid var(--border); padding-bottom: 8px; }
  #content h2 { font-size: 1.25rem; margin-top: 2em; }
  #content h3 { font-size: 1.05rem; margin-top: 1.6em; }
  #content p, #content li { color: var(--fg); }
  #content code {
    background: var(--code-bg);
    padding: 0.15em 0.4em;
    border-radius: 4px;
    font-size: 0.9em;
  }
  #content pre {
    background: var(--code-bg);
    padding: 12px;
    border-radius: 8px;
    overflow-x: auto;
  }
  #content pre code { background: none; padding: 0; }
  #content table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
    overflow-x: auto;
    display: block;
  }
  #content th, #content td {
    border: 1px solid var(--border);
    padding: 6px 10px;
    text-align: left;
  }
  #content th { color: var(--muted); }
  #content img { max-width: 100%; height: auto; }
  #content blockquote {
    border-left: 3px solid var(--accent);
    margin: 1em 0;
    padding: 0.2em 1em;
    color: var(--muted);
  }
  .loading { color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="topnav">
    <a href="index.html">&larr; Home</a>
    <a href="lesson/explore.html">Sound explorer</a>
    <a href="lesson/index.html">Trainer</a>
  </div>
  <div id="content"><p class="loading">Loading…</p></div>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
fetch('LEARNING.md')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.text();
  })
  .then(md => {
    document.getElementById('content').innerHTML = marked.parse(md);
  })
  .catch(err => {
    document.getElementById('content').innerHTML =
      '<p class="loading">Could not load LEARNING.md (' + err.message + '). ' +
      'You can read it directly: <a href="LEARNING.md">LEARNING.md</a>.</p>';
  });
</script>
</body>
</html>
